# =============================================================================
# FonziGo - Docker Compose Configuration
# Ejecutar con: docker-compose up -d
# =============================================================================

networks:
  fonzigo-network:
    driver: bridge
    name: fonzigo-network

  volumes:
  db-data:
    driver: local
    name: fonzigo-db-data

# -----------------------------------------------------------------------------
# Services
# -----------------------------------------------------------------------------
services:

  # ---------------------------------------------------------------------------
  # Database - PostgreSQL 17 (Development)
  # ---------------------------------------------------------------------------
  database:
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: fonzigo-database-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - fonzigo-network
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      TZ: Europe/Madrid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend - Spring Boot 4.0 / Java 21 (Development)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fonzigo-backend-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - fonzigo-network
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: Europe/Madrid
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Frontend - Angular 21 / Nginx (Development)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fonzigo-frontend-dev
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - fonzigo-network
    depends_on:
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: Europe/Madrid
