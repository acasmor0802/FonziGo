<header class="header">
  <div class="header__container">
    <!-- Logo + Nav Section (agrupados) -->
    <div class="header__left">
      <section class="header__logo-section">
        <a routerLink="/" class="header__logo-link" aria-label="Ir a página principal">
          <img src="1.svg" alt="FonziGo" class="header__logo" width="120" height="40" fetchpriority="high">
        </a>
      </section>

      <!-- Main Navigation (visible desktop) -->
      <nav class="header__main-nav" aria-label="Navegación principal">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="header__nav-link">Inicio</a>
        <a routerLink="/productos" routerLinkActive="active" class="header__nav-link">Productos</a>
        <a routerLink="/contacto" routerLinkActive="active" class="header__nav-link">Contacto</a>
      </nav>
    </div>

    <!-- Botón Hamburguesa (solo móvil) -->
    <app-button
      variant="ghost"
      size="md"
      (clicked)="toggleMobileMenu()"
      [ariaLabel]="isMobileMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      class="header__hamburger"
      [class.header__hamburger--active]="isMobileMenuOpen()"
    >
      @if (isMobileMenuOpen()) {
        <img src="cancelar.svg" alt="Cerrar menú" class="header__hamburger-icon" width="24" height="24">
      } @else {
        <img src="menu_1.svg" alt="Abrir menú" class="header__hamburger-icon" width="24" height="24">
      }
    </app-button>

    <!-- Action Items -->
    <section
      class="header__actions"
      [class.header__actions--open]="isMobileMenuOpen()"
      #mobileMenu
      (mousedown)="onMenuDragStart($event)"
      (mousemove)="onMenuDragMove($event)"
      (mouseup)="onMenuDragEnd()"
      (mouseleave)="onMenuDragEnd()"
    >
      <!-- Theme Toggle -->
      <app-button
        variant="ghost"
        size="md"
        (clicked)="toggleTheme()"
        [ariaLabel]="themeLabel()"
        class="header__theme-toggle"
      >
        <span class="header__theme-icon">
          @if (isDarkMode()) {
            <lucide-icon [img]="SunIcon" [size]="24" [strokeWidth]="2"></lucide-icon>
          } @else {
            <lucide-icon [img]="MoonIcon" [size]="24" [strokeWidth]="2"></lucide-icon>
          }
        </span>
      </app-button>

      <!-- Shopping Cart -->
      <a routerLink="/carrito" class="header__cart-link" aria-label="Carrito de la compra" (click)="closeMobileMenu()">
        <span class="header__cart-icon" aria-hidden="true">
          <lucide-icon [img]="CartIcon" [size]="20" [strokeWidth]="2"></lucide-icon>
        </span>
        <span class="visually-hidden">Carrito</span>
        @if (cartItemCount() > 0) {
          <span class="header__cart-badge">{{ cartItemCount() }}</span>
        }
      </a>

      <!-- Auth Navigation -->
      <nav class="header__nav" aria-label="Navegación de autenticación">
        <!-- Mobile Navigation Links -->
        <div class="header__mobile-nav">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="header__nav-link" (click)="closeMobileMenu()">Inicio</a>
          <a routerLink="/productos" routerLinkActive="active" class="header__nav-link" (click)="closeMobileMenu()">Productos</a>
          <a routerLink="/contacto" routerLinkActive="active" class="header__nav-link" (click)="closeMobileMenu()">Contacto</a>
        </div>
        
        @if (isLoggedIn()) {
          <!-- Usuario logueado: mostrar foto de perfil -->
          <div class="header__user-menu">
            <a routerLink="/perfil" class="header__profile" (click)="closeMobileMenu()">
              <img [src]="userPhoto()" [alt]="currentUser()?.name || 'Perfil'" class="header__profile-img">
              <span class="header__profile-name">{{ currentUser()?.name }}</span>
            </a>
            <button class="header__logout-btn" (click)="logout()" title="Cerrar sesión">
              Salir
            </button>
          </div>
        } @else {
          <!-- Usuario no logueado: botones de auth -->
          <a routerLink="/login" class="btn btn-secondary" (click)="closeMobileMenu()">
            Iniciar sesión
          </a>
          
          <a routerLink="/register" class="btn btn-primary" (click)="closeMobileMenu()">
            Registrarse
          </a>
        }
      </nav>
    </section>
  </div>

  <!-- Overlay para cerrar el menú -->
  @if (isMobileMenuOpen()) {
    <div 
      class="header__overlay"
      (click)="closeMobileMenu()"
    ></div>
  }
</header>
