# =============================================================================
# FonziGo Backend - Application Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
server.port=8080
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# -----------------------------------------------------------------------------
# Database Configuration (PostgreSQL)
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fonzigo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fonzi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fonzipass}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -----------------------------------------------------------------------------
# Security - JWT Configuration
# -----------------------------------------------------------------------------
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:tu_clave_secreta_super_larga_con_minimo_veinticinco_caracteres_para_HS256_JWT_TOKEN}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:86400000}

# -----------------------------------------------------------------------------
# Security - Google OAuth2
# -----------------------------------------------------------------------------
google.client-id=${GOOGLE_CLIENT_ID:952787149260-mktleu05ui8av17c06uj9so115na9utt.apps.googleusercontent.com}

# -----------------------------------------------------------------------------
# File Upload Configuration
# -----------------------------------------------------------------------------
file.upload.dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -----------------------------------------------------------------------------
# API Documentation (OpenAPI / Swagger)
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# -----------------------------------------------------------------------------
# Actuator (Health checks & Monitoring)
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.fonzigo.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
